name: Atualizar dados

on:
  schedule:
    - cron: '0 9 * * *'    # todo dia às 6h (horário de Brasília)
    - cron: '0 23 * * *'   # todo dia às 20h (depois das sessões)
  workflow_dispatch:       # permite rodar na hora, pelo botão "Run workflow"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow
      - run: python coletar.py
      - name: Salvar a página atualizada
        run: |
          git config user.name "robo-xereta"
          git config user.email "robo-xereta@users.noreply.github.com"
          git add index.html cache_materias.json
          git diff --staged --quiet || git commit -m "Atualiza dados $(date +%F)"
          git push
